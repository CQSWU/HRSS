name: HRSS-Switcher-S0
population_curriculum:
  populations: [50, 100, 200]
  cycles: 10
candidate_policy:
  weights_path: weights/ARPE-Final-1B
  checkpoint_path: weights/ARPE-Final-1B/checkpoint_p0/checkpoint_000244175_1000140800.pth
  base_weights_path: weights/EPOM-L
  base_checkpoint_path: weights/EPOM-L/checkpoint_p0/checkpoint_000024418_100016128.pth
global_settings:
  train_dir: weights/switcher_training
  device: gpu
  seed: 0
experiment_settings:
  save_every_sec: 300
  save_best_every_sec: 86400
  save_best_after: 1000000000000
  save_best_metric: avg_throughput
  save_milestones_sec: -1
  keep_checkpoints: 60
  encoder_custom: switcher
  train_for_env_steps: 1000000000
  train_for_seconds: 604800
  hidden_size: 128
  learning_rate: 0.0001
  gamma: 0.99
  lr_schedule: constant
  normalize_input: false
  switcher_initial_ao_probability: 0.1
async_ppo:
  async_rl: true
  num_epochs: 2
  max_grad_norm: 2.0
  batch_size: 8192
  num_workers: 24
  num_envs_per_worker: 1
  worker_num_splits: 1
  rollout: 32
  recurrence: 1
  use_rnn: false
  with_vtrace: false
  num_batches_per_iteration: 1
  max_policy_lag: 100
  ppo_clip_ratio: 0.2
  exploration_loss_coeff: 0.005
  value_loss_coeff: 0.5
environment:
  name: POMAPF-HRSS-v0
  switcher_caar_device: auto
  switcher_max_planning_steps: 10000
  switcher_team_reward_coefficient: 1.0
  grid_config:
    on_target: restart
    collision_system: block_both
    map_name: maps/train.yaml
    max_episode_steps: 512
    obs_radius: 5
    num_agents: 50
