[project]
name = "arpe-pomapf"
version = "0.2.0"
description = "AORePlan, ARPE and HRSS for lifelong partially observable MAPF"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.12"
dependencies = [
    "torch==2.8.0",
    "sample-factory==2.1.1",
    "pogema==1.4.0",
    "gymnasium==0.28.1",
    "numpy==1.26.4",
    "pyyaml>=6.0",
    "pydantic==1.9.1",
    "cppimport>=22.8.2",
    "pybind11>=2.10",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "agents",
    "learning",
    "maps",
    "planning",
    "pomapf_env",
]
py-modules = [
    "evaluate",
    "train_arpe",
    "train_switcher",
]

[tool.setuptools.package-data]
maps = ["*.yaml"]
planning = ["planner.cpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".codex_backups", ".venv", "backups", "tmp"]

[tool.uv]
override-dependencies = ["faster-fifo==1.5.2; sys_platform != 'win32'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
